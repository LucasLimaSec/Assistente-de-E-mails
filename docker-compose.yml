services:
  assistente-email:
    build: .
    image: assistente-email:latest
    container_name: assistente-email
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - ollama
    # Fica no ar: bot + horários (análise 05:30, relatório 08:00, resumo sábado 17:00).
    restart: unless-stopped
    stop_grace_period: 30s
    # Saudável enquanto o batimento (gravado a cada 5 min pelo serviço) tiver menos de 15 min.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/app/data/batimento') > 900)"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # IA local. Sem "ports": só os containers deste compose falam com ela.
  ollama:
    image: ollama/ollama:0.40.11
    container_name: assistente-ollama
    volumes:
      - ollama-modelos:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # uma análise por vez
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"         # descarrega o modelo e libera a RAM depois de 5 min parado
    mem_limit: 5g                     # protege os outros containers do servidor (8 GB no total)
    restart: unless-stopped

volumes:
  ollama-modelos:
